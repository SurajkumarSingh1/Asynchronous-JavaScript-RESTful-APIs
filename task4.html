<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>
    Real-Time Weather Dashboard
  </title>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>

    :root{

      --bg:#020617;
      --card:rgba(255,255,255,0.08);

      --primary:#38bdf8;
      --secondary:#818cf8;

      --text:#ffffff;
      --muted:#cbd5e1;

      --danger:#ef4444;

      --shadow:
      0 10px 30px rgba(0,0,0,0.35);

    }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{

      font-family:'Poppins',sans-serif;

      min-height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;

      padding:25px;

      color:var(--text);

      background:
      linear-gradient(
      135deg,
      #020617,
      #0f172a,
      #1e293b
      );

      overflow-x:hidden;

    }

    .app{

      width:100%;
      max-width:1000px;

      background:var(--card);

      backdrop-filter:blur(18px);

      border:
      1px solid rgba(255,255,255,0.1);

      border-radius:30px;

      padding:35px;

      box-shadow:var(--shadow);

      animation:fadeIn 1s ease;

    }

    .header{

      text-align:center;

      margin-bottom:35px;

    }

    .header h1{

      font-size:3rem;

      background:
      linear-gradient(
      to right,
      var(--primary),
      var(--secondary)
      );

      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;

      margin-bottom:10px;

    }

    .header p{

      color:var(--muted);

    }

    .search-box{

      display:flex;
      gap:15px;

      margin-bottom:35px;

      flex-wrap:wrap;

    }

    .search-input{

      flex:1;

      padding:18px;

      border:none;

      border-radius:16px;

      background:rgba(255,255,255,0.08);

      color:white;

      font-size:1rem;

      outline:none;

    }

    .search-input::placeholder{

      color:#cbd5e1;

    }

    .search-btn{

      border:none;

      padding:18px 28px;

      border-radius:16px;

      background:
      linear-gradient(
      135deg,
      var(--primary),
      var(--secondary)
      );

      color:white;

      font-weight:600;

      cursor:pointer;

      transition:0.3s;

    }

    .search-btn:hover{

      transform:translateY(-3px);

    }

    .weather{

      display:none;

      animation:fadeUp 0.6s ease;

    }

    .top{

      display:flex;
      justify-content:space-between;
      align-items:center;

      flex-wrap:wrap;

      gap:20px;

      margin-bottom:40px;

    }

    .city h2{

      font-size:2.5rem;
      margin-bottom:8px;

    }

    .city p{

      color:var(--muted);

      text-transform:capitalize;

    }

    .temp{

      font-size:5rem;
      font-weight:700;

    }

    .weather-icon{

      width:120px;

      margin-top:10px;

    }

    .details{

      display:grid;

      grid-template-columns:
      repeat(auto-fit,minmax(220px,1fr));

      gap:20px;

    }

    .card{

      background:rgba(255,255,255,0.06);

      border-radius:22px;

      padding:25px;

      text-align:center;

      border:
      1px solid rgba(255,255,255,0.08);

      transition:0.3s;

    }

    .card:hover{

      transform:translateY(-6px);

    }

    .card h3{

      margin-bottom:12px;

      color:var(--muted);

      font-size:1rem;

    }

    .card p{

      font-size:2rem;
      font-weight:600;

    }

    .error{

      display:none;

      margin-top:20px;

      padding:18px;

      border-radius:14px;

      background:
      rgba(239,68,68,0.15);

      border:
      1px solid rgba(239,68,68,0.35);

      color:#fecaca;

      text-align:center;

    }

    .loader{

      display:none;

      text-align:center;

      margin-top:25px;

    }

    .loader::after{

      content:"";

      width:45px;
      height:45px;

      border:
      5px solid rgba(255,255,255,0.15);

      border-top:
      5px solid var(--primary);

      border-radius:50%;

      display:inline-block;

      animation:spin 1s linear infinite;

    }

    @keyframes spin{

      100%{
        transform:rotate(360deg);
      }

    }

    @keyframes fadeUp{

      from{
        opacity:0;
        transform:translateY(25px);
      }

      to{
        opacity:1;
        transform:translateY(0);
      }

    }

    @keyframes fadeIn{

      from{
        opacity:0;
      }

      to{
        opacity:1;
      }

    }

    @media(max-width:700px){

      .header h1{

        font-size:2.2rem;

      }

      .search-box{

        flex-direction:column;

      }

      .temp{

        font-size:3.5rem;

      }

      .city h2{

        font-size:2rem;

      }

    }

  </style>

</head>

<body>

  <main class="app">

    <!-- HEADER -->

    <div class="header">

      <h1>
        Weather Dashboard
      </h1>

      <p>
        Live Weather with Async JavaScript & REST APIs
      </p>

    </div>

    <!-- SEARCH -->

    <form
      class="search-box"
      id="searchForm"
    >

      <input
        type="text"
        id="cityInput"
        class="search-input"
        placeholder="Search city..."
        required
      />

      <button
        class="search-btn"
        type="submit"
      >
        Search
      </button>

    </form>

    <!-- LOADER -->

    <div
      class="loader"
      id="loader"
    ></div>

    <!-- ERROR -->

    <div
      class="error"
      id="error"
    ></div>

    <!-- WEATHER SECTION -->

    <section
      class="weather"
      id="weather"
    >

      <div class="top">

        <div class="city">

          <h2 id="cityName">
            Delhi
          </h2>

          <p id="description">
            clear sky
          </p>

          <img
            id="weatherIcon"
            class="weather-icon"
            src=""
            alt="Weather Icon"
          />

        </div>

        <div class="temp">

          <span id="temperature">
            0
          </span>°C

        </div>

      </div>

      <!-- WEATHER DETAILS -->

      <div class="details">

        <article class="card">

          <h3>
            Humidity
          </h3>

          <p id="humidity">
            0%
          </p>

        </article>

        <article class="card">

          <h3>
            Wind Speed
          </h3>

          <p id="wind">
            0 km/h
          </p>

        </article>

        <article class="card">

          <h3>
            Feels Like
          </h3>

          <p id="feelsLike">
            0°C
          </p>

        </article>

        <article class="card">

          <h3>
            Pressure
          </h3>

          <p id="pressure">
            0 hPa
          </p>

        </article>

      </div>

    </section>

  </main>

  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script>

    // =========================
    // YOUR API KEY
    // =========================

    const API_KEY =
    "f3daa4b46711f8416c6289b7d05c0dcd";

    // =========================
    // ELEMENTS
    // =========================

    const searchForm =
    document.getElementById("searchForm");

    const cityInput =
    document.getElementById("cityInput");

    const loader =
    document.getElementById("loader");

    const error =
    document.getElementById("error");

    const weather =
    document.getElementById("weather");

    const cityName =
    document.getElementById("cityName");

    const description =
    document.getElementById("description");

    const weatherIcon =
    document.getElementById("weatherIcon");

    const temperature =
    document.getElementById("temperature");

    const humidity =
    document.getElementById("humidity");

    const wind =
    document.getElementById("wind");

    const feelsLike =
    document.getElementById("feelsLike");

    const pressure =
    document.getElementById("pressure");

    // =========================
    // FETCH WEATHER
    // =========================

    async function getWeather(city){

      try{

        loader.style.display = "block";

        weather.style.display = "none";

        error.style.display = "none";

        // API REQUEST

        const response =
        await fetch(

          `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}&units=metric`

        );

        // HANDLE API ERRORS

        if(!response.ok){

          throw new Error(
            "City not found"
          );

        }

        // CONVERT RESPONSE TO JSON

        const data =
        await response.json();

        // DISPLAY WEATHER

        displayWeather(data);

      }

      catch(err){

        showError(err.message);

      }

      finally{

        loader.style.display = "none";

      }

    }

    // =========================
    // DISPLAY WEATHER DATA
    // =========================

    function displayWeather(data){

      // NESTED JSON OBJECTS

      const city =
      data.name;

      const weatherData =
      data.weather[0];

      const main =
      data.main;

      const windData =
      data.wind;

      // UPDATE UI

      cityName.textContent =
      city;

      description.textContent =
      weatherData.description;

      temperature.textContent =
      Math.round(main.temp);

      humidity.textContent =
      `${main.humidity}%`;

      // CONVERT m/s TO km/h

      wind.textContent =
      `${(windData.speed * 3.6).toFixed(1)} km/h`;

      feelsLike.textContent =
      `${Math.round(main.feels_like)}°C`;

      pressure.textContent =
      `${main.pressure} hPa`;

      // WEATHER ICON

      weatherIcon.src =
      `https://openweathermap.org/img/wn/${weatherData.icon}@2x.png`;

      // SHOW WEATHER CARD

      weather.style.display = "block";

    }

    // =========================
    // SHOW ERROR
    // =========================

    function showError(message){

      error.textContent =
      message;

      error.style.display =
      "block";

    }

    // =========================
    // SEARCH EVENT
    // =========================

    searchForm.addEventListener(
      "submit",
      e => {

        e.preventDefault();

        const city =
        cityInput.value.trim();

        if(city){

          getWeather(city);

        }

      }
    );

    // =========================
    // GEOLOCATION WEATHER
    // =========================

    async function getLocationWeather(){

      if(navigator.geolocation){

        navigator.geolocation.getCurrentPosition(

          async position => {

            const lat =
            position.coords.latitude;

            const lon =
            position.coords.longitude;

            try{

              loader.style.display =
              "block";

              const response =
              await fetch(

                `https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&appid=${API_KEY}&units=metric`

              );

              if(!response.ok){

                throw new Error(
                  "Unable to fetch location weather"
                );

              }

              const data =
              await response.json();

              displayWeather(data);

            }

            catch(err){

              showError(err.message);

              getWeather("Delhi");

            }

            finally{

              loader.style.display =
              "none";

            }

          },

          () => {

            // IF LOCATION ACCESS DENIED

            getWeather("Delhi");

          }

        );

      }

      else{

        getWeather("Delhi");

      }

    }

    // =========================
    // LOAD DEFAULT WEATHER
    // =========================

    getLocationWeather();

  </script>

</body>

</html>
